<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Survey Form</title>
    </head>
    <body>
        <h1 id="title">Dani's Build a Survey Form</h1>
        <p id="description">Thank you for taking the time to help us improve the platform</p>
        <form id="survey-form">
            <label id="name-label">Name</label>
            <input id="name" type="text" placeholder="Insert your complete Name" required>

            <label id="email-label">Email</label>
            <input id="email" type="email" pattern=".+@example.com" placeholder="Insert your Email" required>

            <label id="number-label">Number</label>
            <input id="number" type="number" min="1" max="15" placeholder="Insert your telefone number">

            <select id="dropdown">
                <option>option 1</option>
                <option>option 2</option>
            </select>

            <select>
                <input type="radio" name="gender" value="female">
                <input type="radio" name="gender" value="male">
            </select>

            <label id="checkbox">Html</label>
            <input type="checkbox" value="html">

            <label id="checkbox">css</label>
            <input type="checkbox" value="css">

            <label id="checkbox">javascript</label>
            <input type="checkbox" value="javascript">

            <label>Comments? Write down</label>
            <textarea placeholder="Additional comments"></textarea>

            <button id="submit" type="submit">Submit</button>

        </form>
    </body>
</html>
